# hms-web: static SPA plus a same-origin /api proxy to hms-services (owned by hms_workspace, root CLAUDE.md §13).
# TLS terminates at the ingress in front of this container; this server speaks plain HTTP on the private network.

# Path only, never the query string: patient searches (?q=) can carry names or record numbers (PHI).
log_format hms_web '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent '
                   '$request_time "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    access_log /dev/stdout hms_web;
    client_max_body_size 1m;

    # The app loads only its own scripts, styles, images and API (no iframes, workers, fonts or third-party hosts).
    # style-src keeps 'unsafe-inline' until the app is checked in a browser under a stricter policy.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # hms-services checks Origin against its PUBLIC_ORIGIN, so Host and Origin pass through unchanged. X-Real-IP is
    # replaced here (a client-sent value is never forwarded); hms-services trusts it only from TRUSTED_PROXIES.
    location /api/ {
        proxy_pass http://hms-services:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_read_timeout 35s;
        proxy_buffering on;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        # File uploads (document attachments ADR-SVC-013, catalogue ADR-SVC-012): up to 20 MiB per file plus the
        # form fields. hms-services enforces each route's own limit; every other API route keeps the 1m above.
        # Headers and proxy settings are inherited from /api/; proxy_pass is not, so it is repeated.
        location ~ ^/api/v1/(documents|catalogue)(/|$) {
            proxy_pass http://hms-services:8080;
            client_max_body_size 21m;
            proxy_read_timeout 120s;
        }
    }

    # Content-hashed build output: cache for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # SPA routes fall back to index.html, which is never cached so a new release is picked up at once.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
    }
}
