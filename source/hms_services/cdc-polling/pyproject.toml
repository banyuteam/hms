[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khanza-cdc-polling"
version = "0.1.0"
description = "Khanza MariaDB -> PostgreSQL 18 CDC by hash-based primary-key range polling"
requires-python = ">=3.10"  # stock Python on Ubuntu 22.04
dependencies = [
    "PyMySQL>=1.1,<2",          # pure Python: no compiler needed on Windows
    "psycopg[binary]>=3.2,<4",  # PostgreSQL 18 client, binary wheels for Windows and Linux
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cdc-polling = "khanza_cdc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs MariaDB 10.6 and PostgreSQL 18 (see tests/integration/README.md)"]
