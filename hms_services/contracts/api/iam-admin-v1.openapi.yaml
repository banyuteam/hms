openapi: 3.1.0
info:
  title: HMS IAM Administration API
  version: 1.0.0
  description: |
    Administration of HMS users, roles and role assignments (ADR-SVC-002). Every endpoint requires a session
    (auth-v1) and the listed permission at the session's facility; all data is limited to the caller's organization,
    and ids of other organizations answer 404. State-changing requests follow the auth-v1 origin/JSON rules.
    Every change is written to the audit trail. Errors use the auth-v1 shape; codes:
    invalid_request (400), forbidden (403), self_change_not_allowed (403), system_role (403), not_found (404),
    conflict (409), last_admin (409), service_unavailable (503).
servers:
  - url: /api/v1
paths:
  /iam/users:
    get:
      summary: List users (permission iam.users.read)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, suspended, deactivated] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: after, in: query, description: id of the last user of the previous page, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Users ordered by id; next_after is present when another page may follow
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: array, items: { $ref: '#/components/schemas/User' } }
                  next_after: { type: string, format: uuid }
  /iam/users/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      summary: One user (iam.users.read)
      responses:
        '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    patch:
      summary: Change status (iam.users.manage). Not for yourself; never suspends the last IAM administrator. Suspension ends the user's sessions at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended, deactivated] }
                reason: { type: string, maxLength: 500, description: required unless status is active }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
  /iam/roles:
    get:
      summary: List roles with their permissions (iam.users.read)
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema: { type: object, properties: { roles: { type: array, items: { $ref: '#/components/schemas/Role' } } } }
    post:
      summary: Create a role (iam.roles.manage). The code iam-admin is reserved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name]
              properties:
                code: { type: string, pattern: '^[a-z][a-z0-9_-]{1,63}$' }
                name: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 1000 }
                permissions: { type: array, items: { type: string } }
      responses:
        '201': { description: Created role, content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }
  /iam/roles/{id}/permissions:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      summary: Replace the permissions of a role (iam.roles.manage). The iam-admin system role cannot be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [permissions]
              properties: { permissions: { type: array, items: { type: string } } }
      responses:
        '200': { description: Updated role, content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }
  /iam/permissions:
    get:
      summary: Permission catalog registered by hms_services (iam.users.read)
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      type: object
                      properties: { code: { type: string }, description: { type: string }, status: { type: string } }
  /iam/users/{id}/role-assignments:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Grant a role to a user (iam.assignments.manage). Not to yourself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role_id, reason]
              properties:
                role_id: { type: string, format: uuid }
                facility_id: { type: [string, 'null'], format: uuid, description: null = whole organization }
                valid_until: { type: [string, 'null'], format: date-time }
                reason: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Assignment created
          content: { application/json: { schema: { type: object, properties: { id: { type: string, format: uuid } } } } }
  /iam/role-assignments/{id}/revoke:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Revoke an assignment (iam.assignments.manage). Not your own; never the last IAM administrator's.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties: { reason: { type: string, maxLength: 500 } }
      responses:
        '204': { description: Revoked }
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        status: { type: string, enum: [active, suspended, deactivated] }
        status_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        identities:
          type: array
          items:
            type: object
            properties:
              issuer: { type: string, description: 'legacy-hms:dokter, legacy-hms:pegawai or an OIDC issuer' }
              subject: { type: string }
              last_authenticated_at: { type: [string, 'null'], format: date-time }
        assignments:
          type: array
          description: Assignments not revoked (some may be future-dated or expired by valid_until)
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              role_id: { type: string, format: uuid }
              role_code: { type: string }
              facility_id: { type: [string, 'null'], format: uuid }
              valid_from: { type: string, format: date-time }
              valid_until: { type: [string, 'null'], format: date-time }
              granted_at: { type: string, format: date-time }
    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [active, retired] }
        system: { type: boolean, description: true for iam-admin }
        permissions: { type: array, items: { type: string } }
