[package]
name = "hms-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "HMS Desktop: native workstation shell hosting the HMS web workspace (ADR-DSK-001, ADR-DSK-002)."
license = "UNLICENSED"
publish = false
build = "build.rs"

[dependencies]
env_logger = "0.11.11"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
toml = "1.2.1"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "platform-verifier"] }
url = "2.5.8"
wry = "0.57.1"

[build-dependencies]
serde_json = "1.0.154"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }
