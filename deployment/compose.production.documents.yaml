# Production TEMPLATE for document understanding (ADR-SVC-009), on top of compose.production.yaml:
#
#   docker compose -f deployment/compose.production.yaml -f deployment/compose.production.documents.yaml config -q
#
# Not production-ready on its own. Before release: pin every image by digest and scan it; encrypt the document volume
# at rest (D-8, host disk encryption); restrict outbound traffic at the host firewall or an egress proxy so that the
# scanner reaches only the ClamAV signature mirrors and the AI bridge only the Anthropic API over HTTPS; back up the
# volume and test the restore; one hms-services replica while documents are on a local volume (D-2).

x-hardening: &hardening
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]

services:
  hms-services:
    networks: [hms-private, hms-scan, hms-convert, hms-ai]
    volumes:
      - hms_assistant_documents:/data/assistant-documents
    secrets: [ai_bridge_secret]
    environment:
      DOCUMENTS_DIR: /data/assistant-documents
      CLAMAV_ADDR: clamav:3310
      CONVERTER_URL: http://converter:3000
      AI_BRIDGE_URL: http://hms-ai-bridge:8090
      AI_BRIDGE_SECRET_FILE: /run/secrets/ai_bridge_secret

  clamav:
    image: ${CLAMAV_IMAGE:?Set an immutable ClamAV image reference (digest)}
    <<: *hardening
    cap_add: ["CHOWN", "SETGID", "SETUID", "DAC_OVERRIDE"]
    volumes:
      - hms_clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s
    networks: [hms-scan]
    restart: unless-stopped
    mem_limit: 3g
    cpus: 1.0

  converter:
    image: ${CONVERTER_IMAGE:?Set an immutable Gotenberg image reference (digest)}
    <<: *hardening
    command:
      - gotenberg
      - --api-port=3000
      - --api-timeout=60s
      - --chromium-disable-routes=true
      - --webhook-disable=true
      - --log-format=json
    tmpfs:
      - /tmp
    networks: [hms-convert]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0

  hms-ai-bridge:
    image: ${HMS_AI_BRIDGE_IMAGE:?Set an immutable hms-ai-bridge image reference (digest)}
    <<: *hardening
    read_only: true
    secrets: [ai_bridge_secret, anthropic_api_key]
    environment:
      BRIDGE_SECRET_FILE: /run/secrets/ai_bridge_secret
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      DOCUMENTS_DIR: /data/assistant-documents
      BRIDGE_SLOTS: ${AI_BRIDGE_SLOTS:-4}
    volumes:
      - hms_assistant_documents:/data/assistant-documents:ro
    networks: [hms-ai, hms-ai-egress]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

networks:
  hms-scan:
  hms-convert:
    internal: true
  hms-ai:
    internal: true
  hms-ai-egress:

volumes:
  hms_assistant_documents:
  hms_clamav_signatures:

secrets:
  ai_bridge_secret:
    file: ${AI_BRIDGE_SECRET_FILE:?Point to a protected secret file outside source control}
  anthropic_api_key:
    file: ${ANTHROPIC_API_KEY_FILE:?Point to a protected secret file outside source control (zero-data-retention organization)}
