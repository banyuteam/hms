openapi: 3.1.0
info:
  title: HMS AI Bridge (internal)
  version: 1.0.0
  description: |
    Internal contract between hms-services (Go, caller) and hms-ai-bridge (Python worker under
    runtimes/python-workers/ai-bridge/), ADR-SVC-009 design item 4. Private network only; never exposed through the
    ingress or to browsers. The bridge is the only component that holds the AI provider key and reaches the provider.

    Trust: hms-services authenticates and authorizes the user, checks and stores the files, assembles the visit facts
    (ADR-SVC-009 D-6), enforces cost caps, validates the answer and writes the audit. The bridge authenticates the caller
    (bearer secret from a mounted file), validates every field, reads the documents by storage key from its read-only
    mount, verifies their SHA-256, calls the model and returns a bounded answer. It keeps nothing and logs no content
    (no document text, question, visit facts or answer).

    Provider constraints (D-3 zero data retention): documents are sent inline (no provider file storage) and no
    server-side fallback to another model is used.
servers:
  - url: http://hms-ai-bridge:8090
paths:
  /healthz:
    get:
      summary: Liveness (no authentication, no dependencies)
      responses:
        '200': { description: ok }
  /readyz:
    get:
      summary: Readiness (configuration loaded, document mount readable, key present); no provider call
      responses:
        '200': { description: ready }
        '503': { description: not ready }
  /v1/read:
    post:
      summary: Read the given documents and answer the question about the tagged visit
      security: [{ bridgeSecret: [] }]
      description: |
        Body at most 64 KiB (documents are referenced, not embedded). At most 5 documents, together at most 20 MiB on
        disk. One request at a time per slot; when all slots are busy the bridge answers 429 at once (no queue). The
        caller's deadline applies; the bridge's own deadline per request is 120 s.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadRequest' }
      responses:
        '200':
          description: The model answered, declined or could not read the documents (see status)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadResponse' }
        '400': { description: invalid_request (shape, unknown field, limits, storage key pattern) }
        '401': { description: unauthorized (missing or wrong bridge secret) }
        '409': { description: checksum_mismatch (a document's SHA-256 or size differs from the request) }
        '413': { description: too_large (documents over 20 MiB together, or body over 64 KiB) }
        '429': { description: busy (all slots in use; retry later) }
        '502': { description: provider_error (the provider answered with an error) }
        '503': { description: 'not_configured (no provider key) or not_implemented (skeleton build)' }
        '504': { description: timeout (deadline exceeded) }
components:
  securitySchemes:
    bridgeSecret:
      type: http
      scheme: bearer
      description: Shared secret from a mounted file on both sides; rotated with the provider key.
  schemas:
    ReadRequest:
      type: object
      additionalProperties: false
      required: [request_id, language, question, visit, documents]
      properties:
        request_id: { type: string, format: uuid, description: also in the audit event; correlates logs }
        language: { type: string, enum: [id, en], description: language of the answer }
        question: { type: string, minLength: 1, maxLength: 2000 }
        visit: { $ref: '#/components/schemas/VisitFacts' }
        documents:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/DocumentRef' }
        max_output_tokens: { type: integer, minimum: 256, maximum: 8192, default: 4096 }
    DocumentRef:
      type: object
      additionalProperties: false
      required: [document_id, storage_key, media_type, sha256, size_bytes]
      properties:
        document_id: { type: string, format: uuid }
        storage_key:
          type: string
          pattern: '^[0-9]{4}/[0-9]{2}/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: relative path on the document volume, generated by hms-services; never a user-supplied name
        media_type:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
          description: what is stored (Office files are already converted to PDF by hms-services)
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        size_bytes: { type: integer, minimum: 1, maximum: 10485760 }
    VisitFacts:
      type: object
      additionalProperties: false
      description: |
        The minimum facts of the explicitly tagged visit (HMS-CRC; ADR-SVC-009 D-6). Closed schema: there is
        no field for a patient name, NIK, address, phone or any other identifier, so none can be sent.
      required: [visit_number]
      properties:
        visit_number: { type: string, pattern: '^[0-9/]{1,17}$' }
        care_setting: { type: [string, 'null'], enum: [inpatient, outpatient, unknown, null] }
        admitted_on: { type: [string, 'null'], format: date }
        discharged_on: { type: [string, 'null'], format: date }
        payer_type: { type: [string, 'null'], maxLength: 64 }
        diagnoses:
          type: array
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required: [code, priority]
            properties:
              code: { type: string, maxLength: 16 }
              name: { type: [string, 'null'], maxLength: 200 }
              priority: { type: integer, minimum: 1, maximum: 99 }
        procedures:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [code]
            properties:
              code: { type: string, maxLength: 16 }
              name: { type: [string, 'null'], maxLength: 200 }
        sep:
          type: [object, 'null']
          additionalProperties: false
          properties:
            number: { type: [string, 'null'], maxLength: 32 }
            service_type: { type: [string, 'null'], enum: ['1', '2', null], description: BPJS jnspelayanan }
            discharged_on: { type: [string, 'null'], format: date }
        discharge_summary_main_diagnosis: { type: [string, 'null'], maxLength: 16 }
    ReadResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, answer, model, bridge_version, usage, duration_ms]
      properties:
        request_id: { type: string, format: uuid }
        status:
          type: string
          enum: [answered, declined, unreadable]
          description: |
            answered: the model answered. declined: the model refused (safety) or the question asked for clinical
            advice or a claim decision. unreadable: the documents could not be read. The caller shows declined and
            unreadable as such, never as an answer.
        answer: { type: string, maxLength: 16000, description: empty unless answered; plain text, AI-generated }
        stop_reason: { type: [string, 'null'], maxLength: 64 }
        model: { type: string, examples: [claude-opus-5-5] }
        bridge_version: { type: string, maxLength: 64 }
        usage:
          type: object
          additionalProperties: false
          required: [input_tokens, output_tokens]
          properties:
            input_tokens: { type: integer, minimum: 0 }
            output_tokens: { type: integer, minimum: 0 }
        duration_ms: { type: integer, minimum: 0 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code: { type: string }
