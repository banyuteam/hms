openapi: 3.1.0
info:
  title: HMS Assistant API
  version: 1.2.0
  description: |
    Implemented in hms_services (package assistant, ADR-SVC-006); used by hms_workspace/web (src/api/claimApi.ts). Deterministic rule evaluation for the assistant: no language model, no
    generated text. Session (auth-v1) and permission `assistant.rules.evaluate` at the session facility required. The
    data permission a rule set reads with is checked for each reference before any lookup. Every evaluation is audited
    (`assistant.rules.evaluate`; data access, codes and counts only) and nothing is returned when the audit event cannot
    be written. Errors use the auth-v1 envelope {"error": {"code", "message"}}; codes are listed per response.
    Active rule set: claim-readiness version 3 (SEP checks of a BPJS visit from legacy `bridging_sep`, ADR-SVC-007);
    versions 1 and 2 are retired and answered with unsupported_rule_set.
    A result is a snapshot of the legacy record at `evaluated_at`. Findings are codes for the client to localize; they
    carry no record values. A complete checklist is an internal readiness check, not insurer acceptance.

    1.1.0 (additive, ADR-SVC-008 Phase A): feedback on an evaluation, aggregate summaries, restricted comments and
    interaction events. Feedback is evidence for rule owners only: it never changes a result, a rule or a permission.
    Every returned evaluation leaves a receipt (ids, rule set and rule results; no record values) so feedback can be
    checked against it; receipts are kept 30 days, or as long as feedback references them.

    1.2.0 (additive, ADR-SVC-009 step 3): upload and delete documents for the assistant to read. Only when the server
    has document handling configured (otherwise the routes answer 404). Reading them with the AI model is a later minor
    version.
servers:
  - url: /api/v1
paths:
  /assistant/rule-sets:
    get:
      summary: Rule sets this service evaluates (static, no PHI, not audited)
      responses:
        '200':
          description: Rule sets
          content:
            application/json:
              schema:
                type: object
                required: [rule_sets]
                properties:
                  rule_sets: { type: array, items: { $ref: '#/components/schemas/RuleSetInfo' } }
        '401': { description: unauthenticated }
        '403': { description: forbidden }
  /assistant/rules/evaluate:
    post:
      summary: Evaluate one rule set against explicit, user-selected context references (side-effect free)
      description: |
        Same-origin JSON only (403 origin_not_allowed, 415 unsupported_media_type). Body at most 4 KiB; unknown fields
        are rejected. Limited per user (429 too_many_requests with Retry-After).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluateRequest' }
      responses:
        '200':
          description: Evaluation result (also when status is partial or not_applicable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evaluation' }
        '400': { description: 'invalid_request (shape, unknown field, body over 4 KiB, reference count or id pattern); unsupported_rule_set' }
        '401': { description: unauthenticated }
        '403': { description: 'forbidden (route permission); reference_forbidden (data permission, checked before lookup); origin_not_allowed' }
        '404': { description: reference_not_found }
        '415': { description: unsupported_media_type }
        '429': { description: too_many_requests }
        '503': { description: 'service_unavailable (legacy read failed or timed out, audit write failed)' }
  /assistant/feedback:
    post:
      summary: Report on a finding or rate the answer of an evaluation the caller ran (1.1.0)
      description: |
        Permission `assistant.rules.evaluate`. Same-origin JSON only; body at most 1 KiB; unknown fields rejected; limited
        per user (429). Accepted only for an evaluation of the same user at the session facility, at most 7 days old;
        a finding must name a rule of that evaluation with the result it had. One current item per user, evaluation and
        target: an identical repeat returns the stored item (200), a change stores a new version (201). Every
        submission and every rejection is audited (`assistant.feedback.submit`; choices only, never the comment).
        Comments are kept 90 days, choices 12 months.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/FindingFeedback'
                - $ref: '#/components/schemas/AnswerFeedback'
      responses:
        '200': { description: unchanged repeat, content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackStored' } } } }
        '201': { description: stored, content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackStored' } } } }
        '400': { description: invalid_request }
        '401': { description: unauthenticated }
        '403': { description: 'forbidden; origin_not_allowed' }
        '404': { description: 'evaluation_not_found (unknown, of another user or facility, or older than 7 days; not said which)' }
        '415': { description: unsupported_media_type }
        '422': { description: 'rule_not_in_evaluation (the rule was not evaluated, or had another result)' }
        '429': { description: too_many_requests }
        '503': { description: 'service_unavailable (store or audit write failed; nothing stored)' }
  /assistant/feedback/summary:
    get:
      summary: Current feedback counts per choice for the session facility (1.1.0)
      description: |
        Permission `assistant.feedback.review`. Groups below `min_group_size` (5) have null counts and
        `suppressed: true`. No user ids and no comment text. `evaluations` is the number of evaluations of the rule set
        in the range (the denominator). Audited (`assistant.feedback.summary`).
      parameters:
        - { name: rule_set, in: query, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' } }
        - { name: version, in: query, schema: { type: integer, minimum: 1 } }
        - { name: from, in: query, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }, description: 'first month (UTC), default: to' }
        - { name: to, in: query, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }, description: 'last month (UTC), default: the current month; at most 12 months' }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackSummary' }
        '400': { description: invalid_request }
        '401': { description: unauthenticated }
        '403': { description: forbidden }
        '503': { description: service_unavailable }
  /assistant/feedback/comments:
    get:
      summary: Comment text of current feedback, newest first, never the submitter (1.1.0)
      description: |
        Permission `assistant.feedback.comments.read`. Comments may contain patient data: every read is audited
        (`assistant.feedback.comments.read`, with the filter and the number returned) and nothing is returned if the
        audit event cannot be written. Pages of 50; pass `next_before` as `before` for the next page.
      parameters:
        - { name: rule_set, in: query, required: true, schema: { type: string } }
        - { name: version, in: query, schema: { type: integer, minimum: 1 } }
        - { name: rule_id, in: query, schema: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: before, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Comments
          content:
            application/json:
              schema:
                type: object
                required: [comments, next_before]
                properties:
                  comments: { type: array, items: { $ref: '#/components/schemas/FeedbackComment' } }
                  next_before: { type: [string, 'null'], format: uuid }
        '400': { description: invalid_request }
        '401': { description: unauthenticated }
        '403': { description: forbidden }
        '503': { description: 'service_unavailable (store or audit write failed)' }
  /assistant/documents:
    post:
      summary: Upload one document (image, PDF, DOCX or XLSX) about an explicitly tagged visit (1.2.0)
      description: |
        Permission `assistant.documents.analyze` (pilot role only) and the visit's data permission
        `encounter.clinical.read`, checked before the file is looked at. Same origin; `multipart/form-data` with exactly
        two parts, `visit_number` and `file`; at most 10 MiB. The file name is never read or stored. Checks, in order:
        type from the content (not the name), malware scan of the original bytes, DOCX/XLSX converted to PDF in an
        isolated converter, PDFs must be unencrypted, without active content (JavaScript, launch actions, embedded
        files) and have 1 to 50 pages; images are re-encoded (metadata such as GPS removed) and at most 20 megapixels.
        Every upload and every refusal is audited (`assistant.document.upload`; types, sizes, reason; never the name or
        content). The stored file is deleted after 7 days.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [visit_number, file]
              properties:
                visit_number: { type: string, pattern: '^[0-9/]{1,17}$' }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredDocument' }
        '400': { description: invalid_request (parts missing, extra or malformed; bad visit number) }
        '401': { description: unauthenticated }
        '403': { description: 'forbidden (route permission or no facility); reference_forbidden (visit data permission); origin_not_allowed' }
        '413': { description: too_large (over 10 MiB, or an archive that unpacks too large) }
        '415': { description: 'unsupported_media_type (not multipart); unsupported_type; legacy_office (DOC/XLS)' }
        '422':
          description: |
            The file was refused: malware_found, macro_document, active_content, encrypted_pdf, too_many_pages,
            image_too_large, unreadable_file
        '429': { description: too_many_requests (20 uploads per minute per user) }
        '503': { description: 'scan_unavailable, conversion_unavailable, service_unavailable (nothing stored)' }
  /assistant/documents/{id}:
    delete:
      summary: Delete one of the caller's own documents from the volume now (1.2.0)
      description: Same origin. The metadata stays (marked purged) for the audit period. Audited (`assistant.document.delete`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '401': { description: unauthenticated }
        '403': { description: 'forbidden; origin_not_allowed' }
        '404': { description: 'document_not_found (unknown, someone else''s, or already deleted)' }
        '503': { description: service_unavailable }
  /assistant/events:
    post:
      summary: Record assistant interaction events (fire-and-forget, 1.1.0)
      description: |
        Session only. Same-origin JSON; body at most 4 KiB; 1 to 20 events; a batch with an invalid event is rejected.
        No text, tags, encounter or patient identifiers. A repeated `event_id` of the same user is ignored. Topic `claim`
        from a session without `assistant.rules.evaluate` is dropped. Events are kept 90 days, monthly counts 12 months.
        Clients send without retrying and never block on the answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [events]
              properties:
                events: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/InteractionEvent' } }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { type: object, required: [accepted], properties: { accepted: { type: integer, description: newly stored events } } }
        '400': { description: invalid_request }
        '401': { description: unauthenticated }
        '403': { description: origin_not_allowed }
        '415': { description: unsupported_media_type }
        '429': { description: too_many_requests }
        '503': { description: service_unavailable }
components:
  schemas:
    RuleSetInfo:
      type: object
      required: [id, version, resource_types, max_references, rules]
      properties:
        id: { type: string, examples: [claim-readiness] }
        version: { type: integer, minimum: 1, description: immutable; any change in behaviour is a new version }
        resource_types: { type: array, items: { $ref: '#/components/schemas/ResourceType' } }
        max_references: { type: integer, minimum: 1 }
        rules: { type: array, items: { type: string }, description: rule ids in evaluation order }
    ResourceType:
      type: string
      enum: [encounter]
    ContextReference:
      type: object
      additionalProperties: false
      required: [resource_type, resource_id]
      properties:
        resource_type: { $ref: '#/components/schemas/ResourceType' }
        resource_id:
          type: string
          pattern: '^[0-9/]{1,17}$'
          description: encounter number (no_rawat) as shown to the user; an identifier, not proof of access
    EvaluateRequest:
      type: object
      additionalProperties: false
      required: [rule_set, context]
      properties:
        rule_set:
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' }
            version:
              type: integer
              minimum: 1
              description: optional; when given it must equal the active version, else 400 unsupported_rule_set
        context:
          type: object
          additionalProperties: false
          required: [references]
          properties:
            references:
              type: array
              minItems: 1
              maxItems: 1
              description: selected explicitly by the user (HMS-CRC); never inferred from the active window or patient
              items: { $ref: '#/components/schemas/ContextReference' }
      examples:
        - rule_set: { id: claim-readiness }
          context: { references: [{ resource_type: encounter, resource_id: 2026/10/26/000123 }] }
    Evaluation:
      type: object
      required: [evaluation_id, status, evaluated_at, rule_set, reference, applicability, findings, summary, data_completeness]
      properties:
        evaluation_id: { type: string, format: uuid, description: also in the audit event; not retrievable later in 1.0.0 }
        status:
          type: string
          enum: [complete, partial, not_applicable]
          description: |
            complete: every rule passed, failed or did not apply. partial: at least one finding is not_evaluated.
            not_applicable: the rule set does not apply to this resource (see applicability); findings is empty.
        evaluated_at: { type: string, format: date-time }
        rule_set:
          type: object
          required: [id, version]
          properties: { id: { type: string }, version: { type: integer } }
        reference: { $ref: '#/components/schemas/ContextReference' }
        applicability:
          type: object
          required: [applies]
          properties:
            applies: { type: boolean }
            reason: { type: [string, 'null'], enum: [payer_not_claimable, null] }
        findings: { type: array, items: { $ref: '#/components/schemas/Finding' } }
        summary:
          type: object
          required: [passed, failed_error, failed_warning, not_applicable, not_evaluated]
          properties:
            passed: { type: integer }
            failed_error: { type: integer }
            failed_warning: { type: integer }
            not_applicable: { type: integer }
            not_evaluated: { type: integer }
        data_completeness:
          type: object
          required: [complete, sources_not_connected, truncated]
          properties:
            complete: { type: boolean, description: false when a source is not connected or a section was truncated }
            sources_not_connected: { type: array, items: { type: string, enum: [sep] } }
            truncated: { type: array, items: { type: string }, description: clinical-timeline-v1 truncated section names }
      examples:
        - evaluation_id: 0b6f1c1e-3d2a-4d8e-9a51-5c0f7f1b2a90
          status: complete
          evaluated_at: '2026-11-09T10:15:00+07:00'
          rule_set: { id: claim-readiness, version: 3 }
          reference: { resource_type: encounter, resource_id: 2026/10/26/000123 }
          applicability: { applies: true, reason: null }
          findings:
            - { rule_id: sep_present, result: passed, severity: error, reason: null, fields: [summary.sep], human_review: false }
            - rule_id: sep_service_type_matches
              result: passed
              severity: warning
              reason: null
              fields: [summary.sep.service_type, summary.care_setting]
              human_review: false
            - rule_id: sep_discharge_date_recorded
              result: passed
              severity: error
              reason: null
              fields: [summary.sep.discharged_at]
              human_review: false
            - { rule_id: primary_diagnosis_coded, result: passed, severity: error, reason: null, fields: [summary.diagnoses], human_review: false }
            - { rule_id: discharge_summary_present, result: passed, severity: error, reason: null, fields: [summary.discharge_summary], human_review: false }
            - rule_id: primary_diagnosis_matches_summary
              result: failed
              severity: warning
              reason: mismatch
              fields: [summary.discharge_summary.main_diagnosis.code, summary.diagnoses]
              human_review: true
            - { rule_id: doctor_procedures_coded, result: passed, severity: warning, reason: null, fields: [summary.coded_procedures], human_review: false }
            - { rule_id: length_of_stay_recorded, result: passed, severity: error, reason: null, fields: [entries.room_stay.length_of_stay], human_review: false }
            - { rule_id: discharge_status_recorded, result: passed, severity: error, reason: null, fields: [entries.room_stay.discharge_status], human_review: false }
          summary: { passed: 8, failed_error: 0, failed_warning: 1, not_applicable: 0, not_evaluated: 0 }
          data_completeness: { complete: true, sources_not_connected: [], truncated: [] }
    Finding:
      type: object
      required: [rule_id, result, severity, reason, fields, human_review]
      properties:
        rule_id:
          type: string
          description: |
            claim-readiness v3: sep_present, sep_service_type_matches, sep_discharge_date_recorded (these three for BPJS
            visits only), primary_diagnosis_coded, discharge_summary_present,
            primary_diagnosis_matches_summary, doctor_procedures_coded, length_of_stay_recorded,
            discharge_status_recorded. Clients show an unknown rule id as "unknown check", never as passed.
        result: { type: string, enum: [passed, failed, not_applicable, not_evaluated] }
        severity:
          type: string
          enum: [error, warning, info]
          description: the weight of the rule if it fails; meaningful only when result is failed
        reason:
          type: [string, 'null']
          enum: [missing, mismatch, outpatient, no_doctor_procedures, care_setting_unknown, prerequisite_failed,
                 section_truncated, source_not_connected, null]
          description: null when passed
        fields:
          type: array
          items: { type: string }
          description: paths into the clinical-timeline-v1 Timeline response the rule looked at (no values)
        human_review: { type: boolean, description: true for every failed and not_evaluated finding }
    FindingFeedback:
      type: object
      additionalProperties: false
      required: [evaluation_id, rule_id, result, reason]
      properties:
        evaluation_id: { type: string, format: uuid }
        rule_id: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        result: { type: string, enum: [passed, failed, not_applicable, not_evaluated], description: the result that was shown }
        reason: { type: string, enum: [result_wrong, unclear, not_relevant, data_outdated] }
        comment: { $ref: '#/components/schemas/FeedbackCommentText' }
    AnswerFeedback:
      type: object
      additionalProperties: false
      required: [evaluation_id, helpfulness]
      properties:
        evaluation_id: { type: string, format: uuid }
        helpfulness: { type: string, enum: [helpful, partially_helpful, not_helpful] }
        expected:
          type: string
          enum: [more_specific, different_interpretation, actionable_steps, additional_information, other]
          description: only with partially_helpful or not_helpful
        comment: { $ref: '#/components/schemas/FeedbackCommentText' }
    FeedbackCommentText:
      type: string
      maxLength: 200
      description: |
        Optional; trimmed; plain text (no control characters other than line breaks). Treated as patient data:
        restricted, never logged or audited, deleted after 90 days.
    FeedbackStored:
      type: object
      required: [feedback_id, version]
      properties:
        feedback_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
    FeedbackSummary:
      type: object
      required: [rule_set, from, to, evaluations, min_group_size, groups]
      properties:
        rule_set:
          type: object
          required: [id, version]
          properties: { id: { type: string }, version: { type: [integer, 'null'] } }
        from: { type: string, examples: ['2026-09'] }
        to: { type: string, examples: ['2026-11'] }
        evaluations: { type: integer }
        min_group_size: { type: integer, examples: [5] }
        groups:
          type: array
          items:
            type: object
            required: [target, rule_id, result, reason, helpfulness, expected, count, comments, suppressed]
            properties:
              target: { type: string, enum: [finding, answer] }
              rule_id: { type: [string, 'null'] }
              result: { type: [string, 'null'] }
              reason: { type: [string, 'null'] }
              helpfulness: { type: [string, 'null'] }
              expected: { type: [string, 'null'] }
              count: { type: [integer, 'null'], description: null when suppressed }
              comments: { type: [integer, 'null'], description: number of comments (never their text); null when suppressed }
              suppressed: { type: boolean }
    FeedbackComment:
      type: object
      required: [feedback_id, target, rule_id, result, reason, helpfulness, expected, comment, date]
      properties:
        feedback_id: { type: string, format: uuid }
        target: { type: string, enum: [finding, answer] }
        rule_id: { type: [string, 'null'] }
        result: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        helpfulness: { type: [string, 'null'] }
        expected: { type: [string, 'null'] }
        comment: { type: string }
        date: { type: string, format: date, description: UTC date only; never the submitter or the time }
    InteractionEvent:
      type: object
      additionalProperties: false
      required: [schema_version, event_id, type, client_at, panel_session]
      properties:
        schema_version: { type: integer, enum: [1] }
        event_id: { type: string, format: uuid, description: client-generated, for deduplication only }
        type: { type: string, enum: [topic_selected, fallback_shown] }
        client_at: { type: string, format: date-time, description: 'client clock; untrusted; at most 7 days old and 1 hour ahead' }
        panel_session: { type: string, format: uuid, description: random id per assistant panel session; never an identity }
        topic: { type: string, enum: [claim, summary, diagnoses, procedures, labs, medications], description: topic_selected only }
        input: { type: string, enum: [button, typed], description: topic_selected only }
        fallback_kind:
          type: string
          enum: [help, need_tag, need_visit, choose_visit, not_loaded, refused]
          description: fallback_shown only
    StoredDocument:
      type: object
      required: [document_id, uploaded_media_type, media_type, size_bytes, page_count, expires_at]
      properties:
        document_id: { type: string, format: uuid }
        uploaded_media_type:
          type: string
          enum: [image/jpeg, image/png, application/pdf,
                 application/vnd.openxmlformats-officedocument.wordprocessingml.document,
                 application/vnd.openxmlformats-officedocument.spreadsheetml.sheet]
        media_type: { type: string, enum: [image/jpeg, image/png, application/pdf], description: as stored (Office as PDF) }
        size_bytes: { type: integer }
        page_count: { type: [integer, 'null'], description: PDFs only }
        expires_at: { type: string, format: date-time, description: when the file is deleted from the volume }
